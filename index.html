
<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CENTIBOY</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{
 margin:0;background:white;color:#7020a0;
 font-family:Georgia,"Times New Roman",serif;
}
body::before{
 content:"";position:fixed;inset:8px;
 border:2px solid #ff1493;
 box-shadow:0 0 6px #ff1493,0 0 18px #ff1493,
 0 0 35px rgba(255,20,147,.45);
 pointer-events:none;z-index:999;
}
.container{
 width:90%;max-width:1100px;
 margin:auto;padding:55px 0 100px;
}
.home-logo{
 display:block;width:min(520px,85%);
 margin:0 auto 45px;cursor:pointer;
}
nav{
 display:flex;justify-content:center;align-items:center;
 flex-wrap:wrap;gap:12px 30px;margin-bottom:75px;
}
nav a{
 color:#7020a0;text-decoration:none;font-size:16px;
 transition:.25s;
}
nav a:hover,nav a.selected{
 color:#ff1493;text-shadow:0 0 8px #ff1493;
}
.page{display:none}
.page.active{display:block}
.page-title{font-size:25px;margin-bottom:25px}
.page-text{font-size:15px;line-height:2}
.post-list{width:100%;max-width:850px}
.post{
 border-bottom:1px solid #e8dce9;
 padding:22px 0;
}
.post-title{
 font-size:25px;color:#7020a0;
 cursor:pointer;line-height:1.5;
}
.post-title:hover{color:#ff1493}
.post-date{
 color:#9875a5;font-size:14px;margin-top:7px;
}
.post-details{display:none;padding-top:22px}
.post.open .post-details{display:block}
.post-content{
 white-space:pre-wrap;word-break:break-word;
 font-size:16px;line-height:2;margin-top:20px;
}
.post-images{
 display:flex;flex-direction:column;
 gap:18px;margin-top:20px;
}
.post-images img{
 display:block;width:auto;max-width:100%;
 max-height:650px;object-fit:contain;
 margin:0 auto;
}
.message{font-size:15px;color:#9875a5;padding:15px 0}
@media(max-width:600px){
 body::before{inset:6px}
 .container{width:86%;padding-top:45px}
 .home-logo{width:92%;margin-bottom:35px}
 nav{gap:12px 18px;margin-bottom:60px}
 nav a{font-size:14px}
 .page-title{font-size:21px}
 .post-title{font-size:21px}
 .post-content{font-size:15px}
}
</style>
</head>

<body>
<div class="container">

<a href="#" onclick="showPage('home');return false;">
<img src="centiboy.png" alt="CENTIBOY" class="home-logo">
</a>

<nav>
<a href="#" data-page="diary" onclick="showPage('diary');return false;">diary</a>
<a href="#" data-page="memoir" onclick="showPage('memoir');return false;">My Memoir</a>
<a href="#" data-page="politics" onclick="showPage('politics');return false;">politics</a>
<a href="#" data-page="travel" onclick="showPage('travel');return false;">travel</a>
<a href="#" data-page="sdd" onclick="showPage('sdd');return false;">SDD</a>
</nav>

<main>
<section id="home" class="page active"></section>

<section id="diary" class="page">
<div class="page-title">diary</div>
<div class="page-text">My daily records.</div>
<div class="post-list" id="list-diary"></div>
</section>

<section id="memoir" class="page">
<div class="page-title">My Memoir</div>
<div class="page-text">Personal memories and stories.</div>
<div class="post-list" id="list-memoir"></div>
</section>

<section id="politics" class="page">
<div class="page-title">politics</div>
<div class="page-text">Political thoughts and records.</div>
<div class="post-list" id="list-politics"></div>
</section>

<section id="travel" class="page">
<div class="page-title">travel</div>
<div class="page-text">Travel records and photographs.</div>
<div class="post-list" id="list-travel"></div>
</section>

<section id="sdd" class="page">
<div class="page-title">SDD</div>
<div class="page-text">SDD archive.</div>
<div class="post-list" id="list-sdd"></div>
</section>
</main>
</div>

<script>
const SUPABASE_URL =
"https://edwffngdcuvtuwyafbfc.supabase.co";

const SUPABASE_KEY =
"sb_publishable_KPsopKCE3KEi83KCsWyDtA_ZA3wsRDH";

const db=window.supabase.createClient(
 SUPABASE_URL,SUPABASE_KEY
);

const categories=["diary","memoir","politics","travel","sdd"];

function showPage(pageId){
 document.querySelectorAll(".page").forEach(p=>{
  p.classList.remove("active");
 });
 document.getElementById(pageId).classList.add("active");

 document.querySelectorAll("nav a").forEach(a=>{
  a.classList.toggle("selected",a.dataset.page===pageId);
 });

 window.scrollTo({top:0,behavior:"smooth"});
}

function addText(parent,tag,className,value){
 const el=document.createElement(tag);
 el.className=className;
 el.textContent=value||"";
 parent.appendChild(el);
 return el;
}

function renderPost(p){
 const article=document.createElement("article");
 article.className="post";

 const title=addText(article,"div","post-title",p.title);
 title.onclick=()=>article.classList.toggle("open");

 addText(article,"div","post-date",p.post_date||"");

 const details=document.createElement("div");
 details.className="post-details";

 let images=p.images||[];
 if(typeof images==="string"){
  try{images=JSON.parse(images)}catch(e){images=[]}
 }
 if(!Array.isArray(images))images=[];

 if(images.length){
  const imageArea=document.createElement("div");
  imageArea.className="post-images";

  images.forEach(url=>{
   if(typeof url!=="string" ||
      !/^https?:\/\//i.test(url))return;

   const img=document.createElement("img");
   img.src=url;
   img.alt=p.title||"CENTIBOY photograph";
   img.loading="lazy";
   imageArea.appendChild(img);
  });

  details.appendChild(imageArea);
 }

 if(p.content){
  addText(details,"div","post-content",p.content);
 }

 article.appendChild(details);
 return article;
}

async function loadPosts(){
 categories.forEach(category=>{
  const list=document.getElementById("list-"+category);
  list.innerHTML='<div class="message">불러오는 중...</div>';
 });

 const {data,error}=await db
  .from("posts")
  .select("id,category,title,post_date,content,images,created_at")
  .order("created_at",{ascending:false});

 if(error){
  categories.forEach(category=>{
   document.getElementById("list-"+category).textContent=
    "게시글을 불러오지 못했습니다. 잠시 후 다시 접속해 주세요.";
  });
  console.error(error);
  return;
 }

 categories.forEach(category=>{
  const list=document.getElementById("list-"+category);
  list.innerHTML="";

  const posts=data.filter(p=>p.category===category);

  if(posts.length===0){
   list.innerHTML='<div class="message">아직 등록된 게시글이 없습니다.</div>';
   return;
  }

  posts.forEach(p=>list.appendChild(renderPost(p)));
 });
}

loadPosts();
</script>
</body>
</html>
