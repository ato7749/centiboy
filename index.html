
<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CENTIBOY</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  background: #ffffff;
  color: #65357d;
  font-family: Georgia, "Times New Roman", serif;
}

body::before {
  content: "";
  position: fixed;
  inset: 8px;
  border: 3px solid #ff1493;
  box-shadow: 0 0 15px #ff69b4;
  pointer-events: none;
  z-index: 999;
}

.container {
  width: 92%;
  max-width: 850px;
  margin: auto;
  padding: 55px 0 100px;
}

/* LOGO */

.logo {
  display: block;
  text-align: center;
  color: #65357d;
  font-family: Arial, sans-serif;
  font-size: 54px;
  font-weight: 900;
  letter-spacing: 3px;
  text-decoration: none;
  margin-bottom: 65px;
}

/* CATEGORY MENU */

nav {
  display: flex;
  justify-content: center;
  align-items: center;
  flex-wrap: wrap;
  gap: 20px 32px;
  margin-bottom: 75px;
}

nav a {
  color: #65357d;
  font-size: 25px;
  font-weight: normal;
  text-decoration: none;
  transition: 0.2s;
}

nav a:hover,
nav a.selected {
  color: #e51b91;
}

/* CATEGORY */

.page {
  display: none;
}

.page.active {
  display: block;
}

.page-title {
  font-size: 25px;
  margin-bottom: 28px;
  text-align: center;
}

.post-list {
  width: 94%;
  margin: auto;
}

/* POST */

.post {
  padding: 22px 0;
  border-bottom: 1px solid #eaddec;
}

.post-title {
  color: #65357d;
  font-size: 19px;
  line-height: 1.5;
  cursor: pointer;
  transition: 0.2s;
}

.post-title:hover {
  color: #e51b91;
}

.post-date {
  display: none;
  color: #9875a5;
  font-size: 14px;
  margin-top: 10px;
}

.post-details {
  display: none;
  padding-top: 18px;
}

.post.open .post-details {
  display: block;
}

.post.open .post-date {
  display: block;
}

/* IMAGES */

.post-images {
  display: flex;
  flex-direction: column;
  gap: 20px;
  margin-bottom: 22px;
}

.post-images img {
  display: block;
  max-width: 100%;
  max-height: 650px;
  width: auto;
  height: auto;
  object-fit: contain;
  margin: auto;
}

/* CONTENT */

.post-content {
  color: #65357d;
  font-size: 16px;
  line-height: 2;
  white-space: pre-wrap;
  word-break: break-word;
}

.message {
  color: #9875a5;
  text-align: center;
  padding: 25px 0;
  font-size: 15px;
}

/* MOBILE */

@media (max-width: 600px) {

  body::before {
    inset: 6px;
    border-width: 2px;
  }

  .container {
    width: 88%;
    padding-top: 45px;
  }

  .logo {
    font-size: 43px;
    letter-spacing: 2px;
    margin-bottom: 50px;
  }

  nav {
    gap: 17px 22px;
    margin-bottom: 60px;
  }

  nav a {
    font-size: 20px;
  }

  .page-title {
    font-size: 23px;
  }

  .post-title {
    font-size: 18px;
  }

  .post-content {
    font-size: 15px;
  }
}
</style>
</head>

<body>

<div class="container">

  <!-- LOGO -->
  <a href="#" class="logo"
     onclick="showPage('home'); return false;">
    CENTIBOY
  </a>

  <!-- MENU -->
  <nav>
    <a href="#" data-page="diary"
       onclick="showPage('diary'); return false;">diary</a>

    <a href="#" data-page="memoir"
       onclick="showPage('memoir'); return false;">My Memoir</a>

    <a href="#" data-page="politics"
       onclick="showPage('politics'); return false;">politics</a>

    <a href="#" data-page="travel"
       onclick="showPage('travel'); return false;">travel</a>

    <a href="#" data-page="sdd"
       onclick="showPage('sdd'); return false;">SDD</a>
  </nav>

  <!-- HOME -->
  <section id="home" class="page active"></section>

  <!-- DIARY -->
  <section id="diary" class="page">
    <div class="page-title">diary</div>
    <div id="list-diary" class="post-list"></div>
  </section>

  <!-- MEMOIR -->
  <section id="memoir" class="page">
    <div class="page-title">My Memoir</div>
    <div id="list-memoir" class="post-list"></div>
  </section>

  <!-- POLITICS -->
  <section id="politics" class="page">
    <div class="page-title">politics</div>
    <div id="list-politics" class="post-list"></div>
  </section>

  <!-- TRAVEL -->
  <section id="travel" class="page">
    <div class="page-title">travel</div>
    <div id="list-travel" class="post-list"></div>
  </section>

  <!-- SDD -->
  <section id="sdd" class="page">
    <div class="page-title">SDD</div>
    <div id="list-sdd" class="post-list"></div>
  </section>

</div>

<script>

/* SUPABASE CONNECTION */

const SUPABASE_URL =
"https://edwffngdcuvtuwyafbfc.supabase.co";

const SUPABASE_KEY =
"sb_publishable_KPsopKCE3KEi83KCsWyDtA_ZA3wsRDH";

const db = window.supabase.createClient(
  SUPABASE_URL,
  SUPABASE_KEY
);

const categories = [
  "diary",
  "memoir",
  "politics",
  "travel",
  "sdd"
];

/* CATEGORY CHANGE */

function showPage(id) {

  document.querySelectorAll(".page").forEach(page => {
    page.classList.remove("active");
  });

  document.getElementById(id).classList.add("active");

  document.querySelectorAll("nav a").forEach(link => {
    link.classList.toggle(
      "selected",
      link.dataset.page === id
    );
  });

  window.scrollTo({
    top: 0,
    behavior: "smooth"
  });
}

/* SAFE TEXT */

function makeText(tag, className, value) {

  const element = document.createElement(tag);

  element.className = className;
  element.textContent = value || "";

  return element;
}

/* CREATE POST */

function createPost(post) {

  const article = document.createElement("article");
  article.className = "post";

  const title = makeText(
    "div",
    "post-title",
    post.title
  );

  const date = makeText(
    "div",
    "post-date",
    post.post_date
  );

  const details = document.createElement("div");
  details.className = "post-details";

  title.onclick = () => {
    article.classList.toggle("open");
  };

  /* IMAGES */

  let images = post.images || [];

  if (typeof images === "string") {
    try {
      images = JSON.parse(images);
    } catch (error) {
      images = [];
    }
  }

  if (!Array.isArray(images)) {
    images = [];
  }

  if (images.length > 0) {

    const imageArea = document.createElement("div");
    imageArea.className = "post-images";

    images.forEach(url => {

      if (
        typeof url !== "string" ||
        !/^https?:\/\//i.test(url)
      ) {
        return;
      }

      const image = document.createElement("img");

      image.src = url;
      image.alt = post.title || "CENTIBOY image";
      image.loading = "lazy";

      imageArea.appendChild(image);
    });

    details.appendChild(imageArea);
  }

  /* CONTENT */

  if (post.content) {

    const content = makeText(
      "div",
      "post-content",
      post.content
    );

    details.appendChild(content);
  }

  article.appendChild(title);
  article.appendChild(date);
  article.appendChild(details);

  return article;
}

/* LOAD POSTS */

async function loadPosts() {

  categories.forEach(category => {

    document.getElementById(
      "list-" + category
    ).textContent = "게시글을 불러오는 중입니다.";

  });

  const { data, error } = await db
    .from("posts")
    .select("id,category,title,post_date,content,images,created_at")
    .order("created_at", {
      ascending: false
    });

  if (error) {

    categories.forEach(category => {

      document.getElementById(
        "list-" + category
      ).textContent = "게시글을 불러오지 못했습니다.";

    });

    console.error("Supabase error:", error);

    return;
  }

  categories.forEach(category => {

    const list = document.getElementById(
      "list-" + category
    );

    list.innerHTML = "";

    const posts = data.filter(post =>
      post.category === category
    );

    if (posts.length === 0) {

      list.textContent = "아직 등록된 게시글이 없습니다.";

      return;
    }

    posts.forEach(post => {

      list.appendChild(
        createPost(post)
      );

    });

  });

}

/* START */

loadPosts();

</script>

</body>
</html>
