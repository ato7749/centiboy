
<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CENTIBOY</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    padding: 25px 10px;
    background: #ffffff;
    color: #65357d;
    font-family: Georgia, "Times New Roman", serif;
}

.container {
    width: 94%;
    max-width: 720px;
    min-height: 90vh;
    margin: 0 auto;
    padding: 40px 20px 60px;
    border: 4px solid #ff1493;
    box-shadow:
        0 0 8px #ff1493,
        0 0 18px #ff69b4,
        0 0 30px rgba(255, 20, 147, 0.25);
}

/* CENTIBOY 네온 로고 */
.logo {
    display: block;
    width: 100%;
    margin: 0 auto 50px;
    padding: 8px 0;
    text-align: center;

    color: #9b35e8;
    font-family: Arial, Helvetica, sans-serif;
    font-size: 56px;
    font-weight: 1000;
    letter-spacing: 3px;
    line-height: 1.2;

    cursor: pointer;

    text-shadow:
        0 0 2px #ffffff,
        0 0 5px #e7c4ff,
        0 0 10px #c77dff,
        0 0 20px #a020f0,
        0 0 35px #8a00ff,
        0 0 55px #7200d9;

    filter: drop-shadow(0 0 8px #a020f0);
}

/* 목차 */
nav {
    display: flex;
    flex-wrap: wrap;
    justify-content: center;
    align-items: center;
    gap: 17px;
    margin-bottom: 55px;
    text-align: center;
}

nav button {
    border: none;
    background: none;
    padding: 5px;
    color: #65357d;
    font-family: Georgia, "Times New Roman", serif;
    font-size: 25px;
    font-weight: bold;
    cursor: pointer;
}

nav button:hover,
nav button.active {
    color: #e51b91;
}

/* 카테고리 제목 */
.category-heading {
    margin: 0 0 30px;
    text-align: center;
    color: #65357d;
    font-size: 27px;
    font-weight: bold;
}

/* 게시글 목록 */
#post-list {
    width: 94%;
    margin: 0 auto;
}

.post {
    margin-bottom: 24px;
    border-bottom: 1px solid #e8c7df;
    padding-bottom: 18px;
}

/* 게시글 제목 */
.post-title {
    display: block;
    width: 100%;
    padding: 8px 0;
    border: none;
    background: none;
    color: #65357d;
    text-align: left;
    font-family: Georgia, "Times New Roman", serif;
    font-size: 19px;
    font-weight: bold;
    cursor: pointer;
    overflow-wrap: anywhere;
}

.post-title:hover {
    color: #e51b91;
}

/* 게시글 상세 내용 */
.post-details {
    display: none;
    padding: 12px 2px 5px;
}

.post.open .post-details {
    display: block;
}

.post-date {
    margin-bottom: 18px;
    color: #8b6597;
    font-size: 16px;
}

.post-images {
    display: flex;
    flex-direction: column;
    gap: 15px;
    margin-bottom: 20px;
}

.post-images img {
    display: block;
    width: 100%;
    height: auto;
    max-height: 600px;
    object-fit: contain;
}

.post-content {
    color: #65357d;
    font-size: 17px;
    line-height: 1.9;
    white-space: pre-wrap;
    overflow-wrap: anywhere;
}

/* 게시글이 없을 때 */
.empty-message {
    padding: 30px 0;
    text-align: center;
    color: #a18aa8;
    font-size: 16px;
}

.loading {
    text-align: center;
    padding: 30px 0;
}

/* 관리자 */
.admin-link {
    display: block;
    margin-top: 60px;
    text-align: center;
    color: #a18aa8;
    font-size: 13px;
    text-decoration: none;
}

.admin-link:hover {
    color: #e51b91;
}

/* 모바일 */
@media (max-width: 600px) {
    body {
        padding: 12px 5px;
    }

    .container {
        width: 98%;
        padding: 30px 12px 45px;
    }

    .logo {
        font-size: 43px;
        margin-bottom: 38px;
    }

    nav {
        gap: 12px;
        margin-bottom: 40px;
    }

    nav button {
        font-size: 20px;
    }

    .category-heading {
        font-size: 24px;
    }

    .post-title {
        font-size: 18px;
    }

    .post-content {
        font-size: 16px;
    }
}
</style>
</head>

<body>

<div class="container">

    <h1 class="logo" onclick="showCategory('diary')">
        CENTIBOY
    </h1>

    <nav>
        <button class="active" data-category="diary"
        onclick="showCategory('diary')">diary</button>

        <button data-category="memoir"
        onclick="showCategory('memoir')">My Memoir</button>

        <button data-category="politics"
        onclick="showCategory('politics')">politics</button>

        <button data-category="travel"
        onclick="showCategory('travel')">travel</button>

        <button data-category="sdd"
        onclick="showCategory('sdd')">SDD</button>
    </nav>

    <h2 class="category-heading" id="category-heading">
        diary
    </h2>

    <div id="post-list">
        <p class="loading">게시글을 불러오는 중입니다.</p>
    </div>

    <a class="admin-link"
       href="https://ato7749.github.io/centiboy/admin.html">
       ADMIN
    </a>

</div>

<script>
const SUPABASE_URL =
"https://edwffngdcuvtuwyafbfc.supabase.co";

const SUPABASE_KEY =
"sb_publishable_KPsopKCE3KEi83KCsWyDtA_ZA3wsRDH";

const db = window.supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY
);

let allPosts = [];
let currentCategory = "diary";

const categoryNames = {
    diary: "diary",
    memoir: "My Memoir",
    politics: "politics",
    travel: "travel",
    sdd: "SDD"
};

function escapeHTML(value) {
    return String(value ?? "").replace(/[&<>"']/g, function(char) {
        return {
            "&": "&amp;",
            "<": "&lt;",
            ">": "&gt;",
            '"': "&quot;",
            "'": "&#39;"
        }[char];
    });
}

function showCategory(category) {
    currentCategory = category;

    document.getElementById("category-heading").textContent =
        categoryNames[category] || category;

    document.querySelectorAll("nav button").forEach(button => {
        button.classList.toggle(
            "active",
            button.dataset.category === category
        );
    });

    renderPosts();
}

function renderPosts() {
    const list = document.getElementById("post-list");

    const posts = allPosts.filter(post => {
        return post.category === currentCategory &&
               String(post.title || "").trim() !== "";
    });

    if (posts.length === 0) {
        list.innerHTML =
        '<div class="empty-message">아직 게시글이 없습니다.</div>';
        return;
    }

    list.innerHTML = posts.map((post, index) => {
        const images = Array.isArray(post.images)
            ? post.images
            : [];

        const imageHTML = images
            .filter(src => typeof src === "string" && src.trim() !== "")
            .map(src => `
                <img
                    src="${escapeHTML(src)}"
                    alt=""
                    loading="lazy"
                    onerror="this.style.display='none'"
                >
            `).join("");

        return `
            <article class="post" id="post-${index}">

                <button
                    class="post-title"
                    onclick="togglePost(${index})"
                    aria-expanded="false"
                    aria-controls="details-${index}">
                    ${escapeHTML(post.title)}
                </button>

                <div class="post-details" id="details-${index}">

                    <div class="post-date">
                        ${escapeHTML(post.post_date || "")}
                    </div>

                    <div class="post-images">
                        ${imageHTML}
                    </div>

                    <div class="post-content">${escapeHTML(post.content || "")}</div>

                </div>
            </article>
        `;
    }).join("");
}

function togglePost(index) {
    const post = document.getElementById("post-" + index);

    if (!post) return;

    const button = post.querySelector(".post-title");
    const isOpen = post.classList.toggle("open");

    button.setAttribute("aria-expanded", String(isOpen));
}

async function loadPosts() {
    const list = document.getElementById("post-list");

    const { data, error } = await db
        .from("posts")
        .select("id,category,title,post_date,content,images,created_at")
        .order("created_at", { ascending: false });

    if (error) {
        console.error(error);

        list.innerHTML =
        '<div class="empty-message">게시글을 불러오지 못했습니다.</div>';

        return;
    }

    allPosts = data || [];

    showCategory(currentCategory);
}

loadPosts();
</script>

</body>
</html>
