<style>

/* =========================
   기본 설정
========================= */

* {
    box-sizing: border-box;
}

html {
    scroll-behavior: smooth;
}

body {
    margin: 0;
    padding: 0;

    background: white;

    color: #65357d;

    font-family:
        Georgia,
        "Times New Roman",
        serif;
}


/* =========================
   전체 페이지
========================= */

.page {

    width: 94%;

    max-width: 720px;

    min-height: 100vh;

    margin: 0 auto;

    padding:
        65px 28px 80px 28px;

    background: white;

    border: 4px solid #ff1493;

    box-shadow:
        0 0 18px #ff69b4;
}


/* =========================
   로고
========================= */

.logo-area {

    width: 100%;

    display: flex;

    justify-content: center;

    align-items: center;

    margin-bottom: 55px;
}

.logo {

    display: block;

    width: 300px;

    max-width: 80%;

    height: auto;
}


/* =========================
   메뉴
========================= */

.menu {

    width: 100%;

    display: flex;

    flex-wrap: wrap;

    justify-content: center;

    align-items: center;

    gap:
        28px 38px;

    margin-bottom: 65px;
}


.menu button {

    border: none;

    outline: none;

    background: transparent;

    padding: 0;

    color: #65357d;

    font-family:
        Georgia,
        "Times New Roman",
        serif;

    font-size: 30px;

    cursor: pointer;

    transition:
        color 0.2s ease,
        transform 0.2s ease;
}


.menu button:hover {

    color: #e51b91;

    transform: scale(1.04);
}


.menu button.active {

    color: #e51b91;
}


/* =========================
   글 목록
========================= */

#post-list {

    width: 92%;

    margin: 0 auto;
}


/* =========================
   글 하나
========================= */

.post {

    margin-bottom: 65px;

    padding-bottom: 45px;

    border-bottom:
        1px solid #ddd;
}


/* =========================
   카테고리
========================= */

.post-category {

    color: #999;

    font-size: 17px;

    margin-bottom: 12px;
}


/* =========================
   제목
========================= */

.post-title {

    margin: 0;

    color: #65357d;

    font-size: 38px;

    font-weight: normal;

    line-height: 1.3;

    cursor: pointer;

    transition:
        color 0.2s ease;
}


.post-title:hover {

    color: #e51b91;
}


/* =========================
   내용 숨기기
========================= */

.post-details {

    display: none;
}


.post.open .post-details {

    display: block;
}


/* =========================
   날짜
========================= */

.post-date {

    color: #777;

    font-size: 23px;

    margin-top: 20px;

    margin-bottom: 25px;
}


/* =========================
   사진
========================= */

.post-image {

    display: block;

    width: 100%;

    max-height: 500px;

    object-fit: cover;

    margin:
        0 auto 25px auto;
}


/* =========================
   본문
========================= */

.post-content {

    color: #555;

    font-size: 20px;

    line-height: 1.9;

    white-space: pre-line;
}


/* =========================
   글 없음
========================= */

.no-post {

    text-align: center;

    padding: 50px 10px;

    color: #999;

    font-size: 20px;
}


/* =========================
   모바일
========================= */

@media (max-width: 600px) {

    .page {

        width: 96%;

        padding:
            55px 15px 70px 15px;
    }


    .logo {

        width: 270px;

        max-width: 82%;
    }


    .logo-area {

        margin-bottom: 45px;
    }


    .menu {

        gap:
            24px 30px;

        margin-bottom: 60px;
    }


    .menu button {

        font-size: 28px;
    }


    #post-list {

        width: 90%;
    }


    .post-title {

        font-size: 32px;
    }


    .post-date {

        font-size: 21px;
    }


    .post-content {

        font-size: 19px;

        line-height: 1.8;
    }

}

</style>

</head>

/* =====================================================
   카테고리 이름
===================================================== */

const categoryNames = {

    diary: "diary",

    memoir: "My Memoir",

    politics: "politics",

    travel: "travel",

    sdd: "SDD"

};


/* =====================================================
   글 열기
===================================================== */

function togglePost(article) {

    article.classList.toggle("open");

}


/* =====================================================
   카테고리 표시
===================================================== */

function showCategory(category) {

    const postList =
        document.getElementById("post-list");


    postList.innerHTML = "";


    document
        .querySelectorAll(".menu button")
        .forEach(function(button) {

            button.classList.remove("active");

        });


    const activeButton =
        document.getElementById(
            "button-" + category
        );


    if (activeButton) {

        activeButton.classList.add("active");

    }


    const categoryPosts =
        posts[category] || [];


    /*
       제목이 없는 글은
       사이트에 표시하지 않는다.
    */

    const visiblePosts =
        categoryPosts.filter(function(post) {

            return (
                post.title &&
                post.title.trim() !== ""
            );

        });


    if (visiblePosts.length === 0) {

        postList.innerHTML = `

            <div class="no-post">

                아직 등록된 글이 없습니다.

            </div>

        `;

        return;

    }


    visiblePosts.forEach(function(post) {


        const article =
            document.createElement("article");


        article.className = "post";


        /* 날짜 */

        let dateHTML = "";


        if (
            post.date &&
            post.date.trim() !== ""
        ) {

            dateHTML = `

                <div class="post-date">

                    ${post.date}

                </div>

            `;

        }


        /* 사진 */

        let imageHTML = "";


        if (Array.isArray(post.images)) {

            post.images.forEach(function(image) {

                if (
                    image &&
                    image.trim() !== ""
                ) {

                    imageHTML += `

                        <img
                            src="${image}"
                            class="post-image"
                            alt="${post.title}">

                    `;

                }

            });

        }


        /* 본문 */

        let contentHTML = "";


        if (
            post.content &&
            post.content.trim() !== ""
        ) {

            contentHTML = `

                <div class="post-content">

                    ${post.content}

                </div>

            `;

        }


        /* 글 생성 */

        article.innerHTML = `

            <div class="post-category">

                ${categoryNames[category]}

            </div>


            <h2
                class="post-title"
                onclick="togglePost(this.parentElement)">

                ${post.title}

            </h2>


            <div class="post-details">

                ${dateHTML}

                ${imageHTML}

                ${contentHTML}

            </div>

        `;


        postList.appendChild(article);

    });

}
