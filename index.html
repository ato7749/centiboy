<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>CENTIBOY</title>

<style>

@import url('https://fonts.googleapis.com/css2?family=Libre+Baskerville&display=swap');

* {
    box-sizing: border-box;
}

html {
    scroll-behavior: smooth;
}

body {
    margin: 0;
    background: white;
    color: #7020a0;
    font-family: "Libre Baskerville", Georgia, serif;
}

/* 네온 핑크 테두리 */
body::before {
    content: "";
    position: fixed;
    inset: 8px;
    border: 2px solid #ff1493;
    box-shadow:
        0 0 6px #ff1493,
        0 0 18px #ff1493,
        0 0 35px rgba(255, 20, 147, 0.45);
    pointer-events: none;
    z-index: 999;
}

/* 전체 */
.container {
    width: 90%;
    max-width: 1100px;
    margin: 0 auto;
    padding: 55px 0 100px;
}

/* CENTIBOY 로고 */
.home-logo {
    display: block;
    width: min(520px, 85%);
    margin: 0 auto 45px;
    cursor: pointer;
}

/* 메뉴 */
nav {
    display: flex;
    justify-content: center;
    align-items: center;
    flex-wrap: wrap;
    gap: 12px 30px;
    margin-bottom: 70px;
}

nav a {
    color: #7020a0;
    text-decoration: none;
    font-size: 16px;
}

nav a:hover {
    color: #ff1493;
}

/* 페이지 */
.page {
    display: none;
}

.page.active {
    display: block;
}


/* =========================
   최신 글
========================= */

.latest-post {
    width: 100%;
    margin-bottom: 70px;
}

/* 대표 사진 */
.latest-image {
    display: block;
    width: 100%;
    max-height: 620px;
    object-fit: cover;
    margin-bottom: 28px;
}

/* 최신 글 제목 */
.latest-title {
    margin: 0 0 8px;
    font-size: 30px;
    line-height: 1.5;
    color: #7020a0;
}

.latest-date {
    margin: 0;
    font-size: 14px;
    color: #777;
}


/* =========================
   이전 글
========================= */

.previous-posts {
    border-top: 1px solid rgba(112, 32, 160, 0.25);
    padding-top: 35px;
}

.previous-title {
    font-size: 20px;
    margin: 0 0 30px;
}

.post-list {
    display: flex;
    flex-direction: column;
    gap: 28px;
}

.post-item {
    display: flex;
    align-items: center;
    gap: 25px;
    text-decoration: none;
    color: inherit;
}

.post-item:hover {
    opacity: 0.65;
}

.post-image {
    width: 150px;
    height: 110px;
    object-fit: cover;
    flex-shrink: 0;
}

.post-info {
    flex: 1;
}

.post-title {
    margin: 0 0 8px;
    font-size: 19px;
    line-height: 1.5;
}

.post-date {
    margin: 0;
    font-size: 13px;
    color: #777;
}


/* =========================
   모바일
========================= */

@media (max-width: 600px) {

    body::before {
        inset: 6px;
    }

    .container {
        width: 86%;
        padding-top: 45px;
    }

    .home-logo {
        width: 92%;
        margin-bottom: 35px;
    }

    nav {
        gap: 12px 18px;
        margin-bottom: 55px;
    }

    nav a {
        font-size: 14px;
    }

    .latest-image {
        max-height: 400px;
    }

    .latest-title {
        font-size: 23px;
    }

    .previous-title {
        font-size: 18px;
    }

    .post-item {
        gap: 15px;
    }

    .post-image {
        width: 105px;
        height: 80px;
    }

    .post-title {
        font-size: 15px;
    }

    .post-date {
        font-size: 11px;
    }
}

</style>
</head>
