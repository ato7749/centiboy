<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>CENTIBOY</title>

<style>

* {
    box-sizing: border-box;
}

html {
    scroll-behavior: smooth;
}

body {
    margin: 0;
    background: white;
    color: #5b287c;
    font-family: Georgia, "Times New Roman", serif;
}

/* 전체 사이트 */
.site {
    width: 100%;
    max-width: 650px;
    min-height: 100vh;
    margin: 0 auto;
    padding: 55px 35px 80px;

    border: 4px solid #ff1493;

    box-shadow:
        0 0 10px #ff1493,
        0 0 25px rgba(255, 20, 147, 0.55);
}

/* 로고 */
.logo {
    display: block;
    width: 210px;
    max-width: 80%;
    height: auto;
    margin: 5px auto 55px;
}

/* 메뉴 */
.menu {
    display: flex;
    justify-content: center;
    align-items: center;
    flex-wrap: wrap;
    gap: 28px;

    margin-bottom: 65px;
}

.menu button {
    border: none;
    background: none;

    color: #642b82;

    font-family: Georgia, "Times New Roman", serif;
    font-size: 25px;

    cursor: pointer;

    padding: 0;

    transition: 0.2s;
}

.menu button:hover {
    color: #ff1493;
    transform: scale(1.05);
}

/* 현재 선택된 메뉴 */
.menu button.active {
    color: #ff1493;
}

/* 글 영역 */
.posts {
    width: 100%;
}

/* 최신 글 */
.latest-post {
    margin-bottom: 55px;
}

/* 대표 사진 */
.latest-image {
    width: 100%;
    display: block;

    max-height: 600px;
    object-fit: cover;

    margin-bottom: 35px;
}

/* 제목 */
.post-title {
    margin: 0 0 12px;

    font-size: 32px;
    font-weight: normal;

    line-height: 1.35;

    color: #642b82;
}

/* 날짜 */
.post-date {
    margin: 0;

    font-size: 23px;
    color: #777;
}

/* 구분선 */
.line {
    width: 100%;
    height: 1px;

    background: #d8cbdc;

    margin: 65px 0 35px;
}

/* 이전 글 */
.previous-title {
    margin: 0 0 30px;

    font-size: 27px;
    font-weight: normal;
}

/* 이전 글 하나 */
.previous-post {
    display: block;

    text-decoration: none;

    color: #642b82;

    padding: 20px 0;

    border-bottom: 1px solid #e1d8e3;

    transition: 0.2s;
}

.previous-post:hover {
    color: #ff1493;
}

.previous-post-title {
    font-size: 23px;
    margin-bottom: 8px;
}

.previous-post-date {
    font-size: 18px;
    color: #888;
}

/* 글이 없을 때 */
.no-post {
    text-align: center;

    font-size: 23px;
    color: #888;

    padding: 50px 0;
}
