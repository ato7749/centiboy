<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>CENTIBOY</title>

<style>

* {
    box-sizing: border-box;
}

html {
    scroll-behavior: smooth;
}

body {
    margin: 0;
    background: white;
    color: #5b287c;
    font-family: Georgia, "Times New Roman", serif;
}

/* 전체 사이트 */
.site {
    width: 100%;
    max-width: 650px;
    min-height: 100vh;
    margin: 0 auto;
    padding: 55px 35px 80px;

    border: 4px solid #ff1493;

    box-shadow:
        0 0 10px #ff1493,
        0 0 25px rgba(255, 20, 147, 0.55);
}

/* 로고 */
.logo {
    display: block;
    width: 210px;
    max-width: 80%;
    height: auto;
    margin: 5px auto 55px;
}

/* 메뉴 */
.menu {
    display: flex;
    justify-content: center;
    align-items: center;
    flex-wrap: wrap;
    gap: 28px;

    margin-bottom: 65px;
}

.menu button {
    border: none;
    background: none;

    color: #642b82;

    font-family: Georgia, "Times New Roman", serif;
    font-size: 25px;

    cursor: pointer;

    padding: 0;

    transition: 0.2s;
}

.menu button:hover {
    color: #ff1493;
    transform: scale(1.05);
}

/* 현재 선택된 메뉴 */
.menu button.active {
    color: #ff1493;
}

/* 글 영역 */
.posts {
    width: 100%;
}

/* 최신 글 */
.latest-post {
    margin-bottom: 55px;
}

/* 대표 사진 */
.latest-image {
    width: 100%;
    display: block;

    max-height: 600px;
    object-fit: cover;

    margin-bottom: 35px;
}

/* 제목 */
.post-title {
    margin: 0 0 12px;

    font-size: 32px;
    font-weight: normal;

    line-height: 1.35;

    color: #642b82;
}

/* 날짜 */
.post-date {
    margin: 0;

    font-size: 23px;
    color: #777;
}

/* 구분선 */
.line {
    width: 100%;
    height: 1px;

    background: #d8cbdc;

    margin: 65px 0 35px;
}

/* 이전 글 */
.previous-title {
    margin: 0 0 30px;

    font-size: 27px;
    font-weight: normal;
}

/* 이전 글 하나 */
.previous-post {
    display: block;

    text-decoration: none;

    color: #642b82;

    padding: 20px 0;

    border-bottom: 1px solid #e1d8e3;

    transition: 0.2s;
}

.previous-post:hover {
    color: #ff1493;
}

.previous-post-title {
    font-size: 23px;
    margin-bottom: 8px;
}

.previous-post-date {
    font-size: 18px;
    color: #888;
}

/* 글이 없을 때 */
.no-post {
    text-align: center;

    font-size: 23px;
    color: #888;

    padding: 50px 0;
}

/* 모바일 */
@media (max-width: 600px) {

    .site {
        width: calc(100% - 20px);

        padding:
            55px
            30px
            70px;

        border-width: 3px;
    }

    .logo {
        width: 190px;
        margin-bottom: 55px;
    }

    .menu {
        gap: 25px 28px;
        margin-bottom: 55px;
    }

    .menu button {
        font-size: 22px;
    }

    .latest-image {
        max-height: none;
    }

    .post-title {
        font-size: 28px;
    }

    .post-date {
        font-size: 20px;
    }

    .previous-title {
        font-size: 25px;
    }

    .previous-post-title {
        font-size: 21px;
    }

}

</style>
</head>


<body>

<div class="site">

    <!-- =========================
         로고
    ========================== -->

    <img
        src="images/logo.png"
        alt="CENTIBOY"
        class="logo"
    >


    <!-- =========================
         카테고리 메뉴
    ========================== -->

    <nav class="menu">

        <button
            onclick="showCategory('diary')"
            id="menu-diary">
            diary
        </button>

        <button
            onclick="showCategory('memoir')"
            id="menu-memoir">
            My Memoir
        </button>

        <button
            onclick="showCategory('politics')"
            id="menu-politics">
            politics
        </button>

        <button
            onclick="showCategory('travel')"
            id="menu-travel">
            travel
        </button>

        <button
            onclick="showCategory('sdd')"
            id="menu-sdd">
            SDD
        </button>

    </nav>


    <!-- =========================
         글이 표시되는 곳
    ========================== -->

    <main class="posts" id="posts"></main>

</div>



<script>

/*
==================================================
여기만 수정하면 새로운 글을 추가할 수 있습니다.
==================================================

category:

diary
memoir
politics
travel
sdd

최신 글이 위에 오도록 작성하세요.
*/


const posts = [

    {
        category: "travel",
        title: "설악산 신선대",
        date: "December 30, 2025",
        image: "images/seoraksan.jpg"
    },


    {
        category: "travel",
        title: "제주도 여행",
        date: "December 20, 2025",
        image: "images/jeju.jpg"
    },


    {
        category: "travel",
        title: "강릉 여행",
        date: "December 10, 2025",
        image: "images/gangneung.jpg"
    },


    {
        category: "diary",
        title: "오늘의 일기",
        date: "December 5, 2025",
        image: "images/diary.jpg"
    },


    {
        category: "memoir",
        title: "나의 기억",
        date: "November 30, 2025",
        image: "images/memoir.jpg"
    },


    {
        category: "sdd",
        title: "SDD 기록",
        date: "November 20, 2025",
        image: "images/sdd.jpg"
    }

];



/*
==================================================
카테고리 표시
==================================================
*/

function showCategory(category) {

    const container = document.getElementById("posts");

    container.innerHTML = "";


    /*
    메뉴 색상 초기화
    */

    document
        .querySelectorAll(".menu button")
        .forEach(button => {

            button.classList.remove("active");

        });


    /*
    선택된 메뉴 색상
    */

    const selectedMenu =
        document.getElementById("menu-" + category);

    if (selectedMenu) {
        selectedMenu.classList.add("active");
    }


    /*
    해당 카테고리 글만 가져오기
    */

    const categoryPosts =
        posts.filter(post => post.category === category);


    /*
    글이 없으면
    */

    if (categoryPosts.length === 0) {

        container.innerHTML = `
            <div class="no-post">
                아직 작성된 글이 없습니다.
            </div>
        `;

        return;
    }


    /*
    첫 번째 글 = 최신 글
    */

    const latest = categoryPosts[0];


    /*
    최신 글
    */

    const latestHTML = `

        <article class="latest-post">

            <img
                src="${latest.image}"
                alt="${latest.title}"
                class="latest-image"
            >

            <h1 class="post-title">
                ${latest.title}
            </h1>

            <p class="post-date">
                ${latest.date}
            </p>

        </article>

    `;


    container.innerHTML = latestHTML;


    /*
    이전 글
    */

    const previousPosts =
        categoryPosts.slice(1, 4);


    if (previousPosts.length > 0) {

        const line = document.createElement("div");

        line.className = "line";

        container.appendChild(line);


        const previousTitle =
            document.createElement("h2");

        previousTitle.className =
            "previous-title";

        previousTitle.textContent =
            "Previous";

        container.appendChild(previousTitle);


        previousPosts.forEach(post => {

            const article =
                document.createElement("a");

            article.className =
                "previous-post";

            article.href = "#";

            article.innerHTML = `

                <div class="previous-post-title">
                    ${post.title}
                </div>

                <div class="previous-post-date">
                    ${post.date}
                </div>

            `;

            container.appendChild(article);

        });

    }

}



/*
==================================================
처음 사이트를 열었을 때
==================================================
*/

showCategory("travel");

</script>

</body>
</html>
