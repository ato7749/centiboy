
<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>simdodam.com</title>

<style>
/* Badaboom BB: 로고에만 적용 */
@font-face {
  font-family: "Badaboom BB";
  src: url("./BADABB__.TTF") format("truetype");
  font-style: normal;
  font-weight: normal;
  font-display: swap;
}

:root {
  --purple: #65357d;
  --pink: #ff1493;
  --hot-pink: #e51b91;
}

* {
  box-sizing: border-box;
}

body {
  margin: 0;
  background: #fff;
  color: var(--purple);
  font-family: Georgia, "Times New Roman", serif;
}

.page {
  width: 94%;
  max-width: 720px;
  min-height: 85vh;
  margin: 24px auto;
  padding: 26px 20px 42px;
  border: 4px solid var(--pink);
  box-shadow: 0 0 18px #ff69b4;
  overflow: hidden;
}

header {
  text-align: center;
}

/* 로고 */
.logo {
  display: block;
  width: 100%;
  margin: 0 auto 22px;
  color: #713b91;
  font-family: "Badaboom BB", Impact, sans-serif;
  font-size: clamp(22px, 7.5vw, 52px);
  font-weight: normal;
  line-height: 1.2;
  letter-spacing: 0;
  text-align: center;
  white-space: nowrap;
  text-shadow:
    0 0 2px #c8a8e4,
    0 0 6px #a45bd1,
    0 0 12px #8b35c2,
    0 0 20px #713b91;
}

/* 카테고리 메뉴 */
.menu {
  display: flex;
  justify-content: center;
  align-items: center;
  flex-wrap: wrap;
  gap: 14px 22px;
  margin: 10px auto 32px;
}

.menu button {
  border: 0;
  padding: 6px 2px;
  background: none;
  color: var(--purple);
  font: bold 28px Georgia, "Times New Roman", serif;
  cursor: pointer;
}

.menu button:hover,
.menu button.active {
  color: var(--hot-pink);
  text-decoration: underline;
  text-underline-offset: 7px;
}

/* 게시글 목록 */
#post-list {
  width: 92%;
  margin: auto;
}

.post {
  padding: 18px 0;
  border-bottom: 1px solid #e8cce2;
}

.post-title {
  margin: 0;
  padding: 0;
  border: 0;
  background: none;
  color: var(--purple);
  font: bold 30px Georgia, "Times New Roman", serif;
  text-align: left;
  cursor: pointer;
  overflow-wrap: anywhere;
}

.post-title:hover {
  color: var(--hot-pink);
}

/* 제목을 눌러야 상세 내용 표시 */
.post-details {
  display: none;
  padding-top: 14px;
}

.post.open .post-details {
  display: block;
}

.post-date {
  margin: 0 0 16px;
  color: #9567a4;
  font: 20px Georgia, "Times New Roman", serif;
}

/* 글 본문 */
.post-block {
  margin: 14px 0;
  color: var(--purple);
  font: 18px/1.8 Georgia, "Times New Roman", serif;
  overflow-wrap: anywhere;
}

.post-block.text {
  white-space: pre-wrap;
}

/* 게시글 사진 */
.post-block.image {
  margin: 18px 0;
}

.post-block.image img {
  display: block;
  width: 100%;
  height: auto;
  max-height: 620px;
  object-fit: contain;
}

/* 안내 문구 */
.empty {
  padding: 40px 8px;
  color: #9a789f;
  text-align: center;
  font: 18px Georgia, "Times New Roman", serif;
}

/* 관리자 페이지 링크 */
.admin-link {
  margin-top: 35px;
  text-align: center;
  font: 14px Arial, sans-serif;
}

.admin-link a {
  color: #a98bb1;
  text-decoration: none;
}

.admin-link a:hover {
  color: var(--hot-pink);
}

/* 모바일 화면 */
@media (max-width: 520px) {
  .page {
    width: 94%;
    margin: 12px auto;
    padding: 20px 12px;
  }

  .logo {
    font-size: clamp(22px, 7.5vw, 38px);
    margin-bottom: 18px;
  }

  .menu {
    gap: 8px 15px;
  }

  .menu button {
    font-size: 23px;
  }

  #post-list {
    width: 96%;
  }

  .post-title {
    font-size: 26px;
  }

  .post-block {
    font-size: 17px;
  }
}
</style>
</head>

<body>

<div class="page">

  <header>
    <div class="logo">simdodam.com</div>

    <nav class="menu" id="menu">
      <button type="button" data-category="diary">diary</button>
      <button type="button" data-category="memoir">My Memoir</button>
      <button type="button" data-category="politics">politics</button>
      <button type="button" data-category="travel">travel</button>
      <button type="button" data-category="sdd">SDD</button>
    </nav>
  </header>

  <main id="post-list">
    <p class="empty">게시글을 불러오는 중입니다.</p>
  </main>

  <div class="admin-link">
    <a href="admin.html">ADMIN</a>
  </div>

</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>
const SUPABASE_URL =
  "https://edwffngdcuvtuwyafbfc.supabase.co";

const SUPABASE_ANON_KEY =
  "sb_publishable_KPsopKCE3KEi83KCsWyDtA_ZA3wsRDH";

const db = window.supabase.createClient(
  SUPABASE_URL,
  SUPABASE_ANON_KEY
);

let currentCategory = "diary";


/* HTML 문자 안전 처리 */
function escapeHTML(value) {
  return String(value ?? "").replace(/[&<>"']/g, ch => ({
    "&": "&amp;",
    "<": "&lt;",
    ">": "&gt;",
    '"': "&quot;",
    "'": "&#39;"
  }[ch]));
}


/* 게시글 열기 및 닫기 */
function togglePost(id) {
  const post = document.getElementById("post-" + id);

  if (post) {
    post.classList.toggle("open");
  }
}


/* 글과 사진을 관리자에서 정한 순서대로 표시 */
function renderBlocks(post) {

  if (
    Array.isArray(post.blocks) &&
    post.blocks.length > 0
  ) {

    return post.blocks.map(block => {

      if (block.type === "image" && block.url) {

        return `
          <div class="post-block image">
            <img
              src="${escapeHTML(block.url)}"
              alt=""
              loading="lazy"
            >
          </div>
        `;
      }

      if (block.type === "text" && block.text) {

        return `
          <div class="post-block text">${escapeHTML(block.text)}</div>
        `;
      }

      return "";

    }).join("");
  }


  /* 기존 게시글 표시 방식도 유지 */
  const images = Array.isArray(post.images)
    ? post.images
    : [];

  const imageHTML = images.map(url => `
    <div class="post-block image">
      <img
        src="${escapeHTML(url)}"
        alt=""
        loading="lazy"
      >
    </div>
  `).join("");

  const textHTML = post.content
    ? `
      <div class="post-block text">
        ${escapeHTML(post.content)}
      </div>
    `
    : "";

  return imageHTML + textHTML;
}


/* 카테고리별 게시글 불러오기 */
async function showCategory(category) {

  currentCategory = category;

  document
    .querySelectorAll("#menu button")
    .forEach(button => {

      button.classList.toggle(
        "active",
        button.dataset.category === category
      );

    });

  const list = document.getElementById("post-list");

  list.innerHTML =
    '<p class="empty">게시글을 불러오는 중입니다.</p>';


  const { data, error } = await db
    .from("posts")
    .select("*")
    .eq("category", category)
    .order("created_at", { ascending: false });


  if (error) {

    console.error("게시글 불러오기 오류:", error);

    list.innerHTML =
      '<p class="empty">게시글을 불러오지 못했습니다. 잠시 후 다시 접속해 주세요.</p>';

    return;
  }


  if (!data || data.length === 0) {

    list.innerHTML =
      '<p class="empty">아직 게시글이 없습니다.</p>';

    return;
  }


  list.innerHTML = data.map(post => `

    <article
      class="post"
      id="post-${escapeHTML(post.id)}"
    >

      <h2>
        <button
          type="button"
          class="post-title"
          data-post-id="${escapeHTML(post.id)}"
        >
          ${escapeHTML(post.title)}
        </button>
      </h2>

      <div class="post-details">

        ${
          post.post_date
            ? `<p class="post-date">${escapeHTML(post.post_date)}</p>`
            : ""
        }

        ${renderBlocks(post)}

      </div>

    </article>

  `).join("");

}


/* 제목 클릭 이벤트 */
document
  .getElementById("post-list")
  .addEventListener("click", event => {

    const button = event.target.closest(".post-title");

    if (!button) return;

    togglePost(button.dataset.postId);

  });


/* 카테고리 클릭 이벤트 */
document
  .querySelectorAll("#menu button")
  .forEach(button => {

    button.addEventListener("click", () => {

      showCategory(button.dataset.category);

    });

  });


/* 처음 접속하면 diary 표시 */
showCategory(currentCategory);

</script>

</body>
</html>
