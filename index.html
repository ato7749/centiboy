<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>CENTIBOY</title>

<style>

* {
    box-sizing: border-box;
}

html {
    scroll-behavior: smooth;
}

body {
    margin: 0;
    background: #ffffff;
    color: #5b2878;
    font-family: Georgia, "Times New Roman", serif;
}

/* 전체 화면 */

.page {
    width: 100%;
    max-width: 760px;
    min-height: 100vh;
    margin: 0 auto;
    padding: 25px 25px 60px;
    border: 4px solid #ff2ca3;
    box-shadow: 0 0 20px rgba(255, 44, 163, 0.45);
}

/* 로고 */

.logo-area {
    width: 100%;
    display: flex;
    justify-content: center;
    align-items: center;
    padding: 25px 10px 35px;
}

.logo {
    width: 85%;
    max-width: 500px;
    height: auto;
    display: block;
    object-fit: contain;
}

/* 메뉴 */

.menu {
    display: flex;
    justify-content: center;
    align-items: center;
    flex-wrap: wrap;
    gap: 12px 28px;
    margin-bottom: 50px;
}

.menu button {
    border: none;
    background: transparent;
    color: #5b2878;
    font-family: Georgia, "Times New Roman", serif;
    font-size: 23px;
    cursor: pointer;
    padding: 5px 3px;
    transition: 0.2s;
}

.menu button:hover {
    color: #e91e9b;
}

.menu button.active {
    color: #e91e9b;
    font-weight: bold;
}

/* 글 목록 */

.posts {
    width: 100%;
}

.post {
    margin-bottom: 70px;
    padding-bottom: 45px;
    border-bottom: 1px solid #dccde2;
}

.post-image {
    width: 100%;
    max-height: 520px;
    object-fit: cover;
    display: block;
    margin-bottom: 25px;
}

.post-title {
    margin: 0 0 12px;
    color: #5b2878;
    font-size: 32px;
    font-weight: normal;
    line-height: 1.3;
}

.post-date {
    color: #777777;
    font-size: 20px;
    margin-bottom: 25px;
}

.post-content {
    color: #333333;
    font-size: 19px;
    line-height: 1.8;
    white-space: pre-line;
}

/* 글이 없을 때 */

.no-post {
    text-align: center;
    padding: 80px 20px;
    color: #888888;
    font-size: 20px;
}

/* 모바일 */

@media (max-width: 600px) {

    .page {
        border-width: 3px;
        padding: 15px 20px 50px;
    }

    .logo-area {
        padding: 20px 5px 30px;
    }

    .logo {
        width: 90%;
    }

    .menu {
        gap: 10px 20px;
        margin-bottom: 45px;
    }

    .menu button {
        font-size: 21px;
    }

    .post-title {
        font-size: 29px;
    }

    .post-date {
        font-size: 18px;
    }

    .post-content {
        font-size: 18px;
    }
}

</style>
</head>


<body>

<div class="page">

    <!-- =========================
         로고
         ========================= -->

    <div class="logo-area">

        <img
            src="file_000000003ad88206b1a20683e46c1497.png"
            class="logo"
            alt="CENTIBOY">

    </div>


    <!-- =========================
         메뉴
         ========================= -->

    <nav class="menu">

        <button
            class="category active"
            data-category="diary">
            diary
        </button>

        <button
            class="category"
            data-category="memoir">
            My Memoir
        </button>

        <button
            class="category"
            data-category="politics">
            politics
        </button>

        <button
            class="category"
            data-category="travel">
            travel
        </button>

        <button
            class="category"
            data-category="sdd">
            SDD
        </button>

        <button
            class="category"
            data-category="all">
            ALL
        </button>

    </nav>


    <!-- =========================
         글이 들어가는 곳
         ========================= -->

    <main id="posts" class="posts"></main>

</div>


<script>

/*
==================================================
글 작성 부분
==================================================

새 글을 추가할 때는 아래 posts 안에 하나씩 추가하면 됩니다.

category:
diary
memoir
politics
travel
sdd

image:
GitHub에 올린 사진 파일 이름

title:
글 제목

date:
날짜

content:
글 내용
==================================================
*/


const posts = [

    {
        category: "diary",

        image: "",

        title: "한탄",

        date: "December 3, 2024",

        content:
` 지나간 일들을 떠올리며 과거에 대해 한탄하고있다.
그럴걸 이라는 생각보다 그러지 말걸 이라는 생각이 더 많다. 
찬란한 과거에 비해 지금은 많이 초라하다고 생각 든다. 
옛날을 좀 더 즐길걸그랬다. 너무나 후회되고 억울 하다. 
과거로 돌아갈 수 없기에 더욱 더 힘들다.`
    },


    {
        category: "diary",

        image: "",

        title: "왜곡",

        date: "December 1, 2024",

        content:
`나는 다른사람들이 남들보다 우월하고 잘났다는 식의 생각을 가지며 살아가는줄 알았다.
그렇기에 나는 모두를 이기적이고 자만심이 가득 한 혐오스런 나르시스트일줄알았다

이제서야 깨닫는다
내가 싫어하던 자만감 넘치는 사람은 친구도 가족도 아닌 나였다.`
    },


    {
        category: "memoir",

        image: "",

        title: "My Memoir",

        date: "2025",

        content:
`나의 기억과 이야기.`
    },


    {
        category: "politics",

        image: "",

        title: "Politics",

        date: "2025",

        content:
`정치와 사회에 대한 글.`
    },


    {
        category: "travel",

        image: "",

        title: "Travel",

        date: "2025",

        content:
`여행 기록.`
    },


    {
        category: "sdd",

        image: "",

        title: "SDD",

        date: "2025",

        content:
`SDD에 나의 회고록.`
    }

];


/*
==================================================
글 표시 기능
==================================================
*/

const postsArea = document.getElementById("posts");

const categoryButtons =
    document.querySelectorAll(".category");


function showPosts(category) {

    postsArea.innerHTML = "";


    const filteredPosts =
        category === "all"
        ? posts
        : posts.filter(post => post.category === category);


    if (filteredPosts.length === 0) {

        postsArea.innerHTML = `
            <div class="no-post">
                아직 글이 없습니다.
            </div>
        `;

        return;
    }


    filteredPosts.forEach(post => {

        const article =
            document.createElement("article");

        article.className = "post";


        let imageHTML = "";

        if (post.image.trim() !== "") {

            imageHTML = `
                <img
                    src="${post.image}"
                    class="post-image"
                    alt="${post.title}">
            `;
        }


        article.innerHTML = `

            ${imageHTML}

            <h2 class="post-title">
                ${post.title}
            </h2>

            <div class="post-date">
                ${post.date}
            </div>

            <div class="post-content">
                ${post.content}
            </div>

        `;


        postsArea.appendChild(article);

    });

}


/*
==================================================
메뉴 클릭
==================================================
*/

categoryButtons.forEach(button => {

    button.addEventListener("click", () => {

        categoryButtons.forEach(btn => {
            btn.classList.remove("active");
        });

        button.classList.add("active");

        const category =
            button.dataset.category;

        showPosts(category);

        window.scrollTo({
            top: 0,
            behavior: "smooth"
        });

    });

});


/*
처음 사이트에 들어왔을 때
diary 글 표시
*/

showPosts("diary");

</script>

</body>
</html>
