<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>CENTIBOY</title>

<style>
@import url('https://fonts.googleapis.com/css2?family=Libre+Baskerville&display=swap');

* {
    box-sizing: border-box;
}

html {
    scroll-behavior: smooth;
}

body {
    margin: 0;
    background: white;
    color: #7020a0;
    font-family: "Libre Baskerville", Georgia, serif;
}

/* 네온 핑크 테두리 */
body::before {
    content: "";
    position: fixed;
    inset: 8px;
    border: 2px solid #ff1493;
    box-shadow:
        0 0 6px #ff1493,
        0 0 18px #ff1493,
        0 0 35px rgba(255, 20, 147, 0.45);
    pointer-events: none;
    z-index: 999;
}

/* 전체 */
.container {
    width: 90%;
    max-width: 1100px;
    margin: 0 auto;
    padding: 55px 0 100px;
}

/* CENTIBOY 이미지 */
.home-logo {
    display: block;
    width: min(520px, 85%);
    margin: 0 auto 45px;
    cursor: pointer;
    transition: transform 0.25s ease;
}

.home-logo:hover {
    transform: scale(1.02);
}

/* 메뉴 */
nav {
    display: flex;
    justify-content: center;
    align-items: center;
    flex-wrap: wrap;
    gap: 12px 30px;
    margin-bottom: 90px;
}

nav a {
    color: #7020a0;
    text-decoration: none;
    font-size: 16px;
    transition: 0.25s ease;
}

nav a:hover {
    color: #ff1493;
    text-shadow:
        0 0 5px #ff1493,
        0 0 12px #ff1493;
}

/* 페이지 내용 */
.page {
    display: none;
}

.page.active {
    display: block;
}

.page-title {
    font-size: 25px;
    margin-bottom: 25px;
}

.page-text {
    font-size: 15px;
    line-height: 2;
}

/* 모바일 */
@media (max-width: 600px) {

    body::before {
        inset: 6px;
    }

    .container {
        width: 86%;
        padding-top: 45px;
    }

    .home-logo {
        width: 92%;
        margin-bottom: 35px;
    }

    nav {
        gap: 12px 18px;
        margin-bottom: 65px;
    }

    nav a {
        font-size: 14px;
    }

    .page-title {
        font-size: 21px;
    }
}
</style>
</head>

<body>

<div class="container">

    <!-- 클릭하면 메인 화면으로 돌아가는 CENTIBOY 이미지 -->
    <a href="#" onclick="showPage('home'); return false;">
        <img
            src="centiboy.png"
            alt="CENTIBOY"
            class="home-logo"
        >
    </a>

    <!-- 메뉴 -->
    <nav>
        <a href="#" onclick="showPage('diary'); return false;">diary</a>
        <a href="#" onclick="showPage('memoir'); return false;">My Memoir</a>
        <a href="#" onclick="showPage('politics'); return false;">politics</a>
        <a href="#" onclick="showPage('travel'); return false;">travel</a>
        <a href="#" onclick="showPage('sdd'); return false;">SDD</a>
    </nav>

    <!-- 메인 -->
    <main>

        <section id="home" class="page active">
        </section>

        <section id="diary" class="page">
            <div class="page-title">diary</div>
            <div class="page-text">
                My daily records.
            </div>
        </section>

        <section id="memoir" class="page">
            <div class="page-title">My Memoir</div>
            <div class="page-text">
                Personal memories and stories.
            </div>
        </section>

        <section id="politics" class="page">
            <div class="page-title">politics</div>
            <div class="page-text">
                Political thoughts and records.
            </div>
        </section>

        <section id="travel" class="page">
            <div class="page-title">travel</div>
            <div class="page-text">
                Travel records and photographs.
            </div>
        </section>

        <section id="sdd" class="page">
            <div class="page-title">SDD</div>
            <div class="page-text">
                SDD archive.
            </div>
        </section>

    </main>

</div>

<script>
function showPage(pageId) {

    const pages = document.querySelectorAll(".page");

    pages.forEach(function(page) {
        page.classList.remove("active");
    });

    document.getElementById(pageId).classList.add("active");

    window.scrollTo({
        top: 0,
        behavior: "smooth"
    });
}
</script>

</body>
</html>
